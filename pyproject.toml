[project]
name = "sql-srs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Slayn", email = "neoslayn@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "streamlit>=1.63.0",
]

[project.scripts]
sql-srs = "sql_srs:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
# Version Python cible (pour les règles de modernisation)
target-version = "py312"

# Longueur de ligne (88 = défaut de Black)
line-length = 88

# Dossiers à ignorer
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Règles à activer
select = [
    "E",      # Erreurs de style pycodestyle
    "F",      # Erreurs Pyflakes (variables non utilisées, etc.)
    "I",      # Tri des imports (isort)
    "B",      # Bugs potentiels (flake8-bugbear)
    "UP",     # Modernisation syntaxe (pyupgrade)
    "SIM",    # Simplifications possibles
]

# Règles à ignorer
ignore = [
    "E501",   # Ligne trop longue (géré par le formatter)
]

# Règles que --fix peut corriger automatiquement
fixable = ["ALL"]

[tool.ruff.format]
# Style des guillemets (comme Black)
quote-style = "double"

# Indentation (comme Black)
indent-style = "space"